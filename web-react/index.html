<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="%BASE_URL%brand/chargesync-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChargeSync</title>
  <link rel="preload" as="image" href="%BASE_URL%brand/chargesync-icon.png" />
  <link rel="stylesheet" href="/src/styles/brand-loading.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
    rel="stylesheet" />
</head>

<body>
  <div id="root">
    <div class="brand-loading" role="status" aria-live="polite" aria-busy="true" aria-label="Loading ChargeSync">
      <div class="brand-loading__content">
        <div class="brand-loading__emblem" aria-hidden="true">
          <span class="brand-loading__orbit"></span>
          <img src="%BASE_URL%brand/chargesync-icon.png" alt="" width="80" height="80" />
        </div>
        <div class="brand-loading__wordmark" aria-hidden="true">Charge<span>Sync</span></div>
        <div class="brand-loading__tagline" aria-hidden="true">Powering Tomorrow</div>
        <div class="brand-loading__track" aria-hidden="true"><span></span></div>
        <p class="brand-loading__message">Loading your experience</p>
      </div>
      <span class="brand-loading__signature" aria-hidden="true">Connected. Charged. Ready.</span>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>

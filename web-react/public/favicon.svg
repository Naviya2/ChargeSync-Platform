<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <!-- Dark square background matching the login screen -->
  <rect x="1" y="1" width="42" height="42" rx="10" fill="#161920" stroke="#2D333F" stroke-width="1.5" />
  
  <!-- Subtle green gradient overlay -->
  <rect x="1" y="1" width="42" height="42" rx="10" fill="url(#bg-grad)" />

  <!-- The bolt graphic centered -->
  <g transform="translate(10, 10)">
    <circle cx="12" cy="12" r="9" stroke="#262C38" stroke-width="1.8" stroke-dasharray="45 15" />
    <circle
      cx="12"
      cy="12"
      r="9"
      stroke="url(#cs-bolt-grad)"
      stroke-width="1.8"
      stroke-dasharray="32 32"
      stroke-linecap="round"
    />
    <path d="M12.5 5.5L8.5 12.5H12L11 18.5L16 11.5H12.5L12.5 5.5Z" fill="url(#cs-bolt-grad)" />
  </g>

  <defs>
    <!-- Background Gradient (to-tr) -->
    <linearGradient id="bg-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5A0" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0.1" />
    </linearGradient>

    <!-- Bolt Gradient -->
    <linearGradient id="cs-bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5A0" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
  </defs>
</svg>
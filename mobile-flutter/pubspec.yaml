name: chargesync
description: "ChargeSync - Intelligent EV Charging Reservation and Recommendation Platform"
publish_to: 'none'

version: 1.0.1+7

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.2
  google_sign_in: ^6.2.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  intl: ^0.20.3
  crypto: ^3.0.3
  flutter_dotenv: ^6.0.1
  permission_handler: ^11.3.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/chargesync_icon.png"
  image_path_android: "assets/images/app_launcher_icon.png"
  background_color_ios: "#000000"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/app_launcher_foreground.png"

